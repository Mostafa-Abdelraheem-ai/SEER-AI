services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: seer_ai_pp
      POSTGRES_USER: seer
      POSTGRES_PASSWORD: seer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seer -d seer_ai_pp"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: SEER-AI++ Backend
      ENVIRONMENT: development
      SECRET_KEY: change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: postgresql+psycopg://seer:seer@db:5432/seer_ai_pp
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      UPLOADS_DIR: /app/uploads
      REPORTS_DIR: /app/outputs/reports
      SEER_EMBEDDING_DIMENSION: 384
      OPENAI_GENERATION_MODEL: gpt-4o-mini
      METRICS_ENABLED: "true"
      LOG_LEVEL: INFO
      TEXT_MODEL_PROVIDER: hybrid
      RAG_GENERATION_PROVIDER: openai
      OCR_PROVIDER: tesseract
      VOICE_ACOUSTIC_PROVIDER: signal
      PYTHONPATH: /app/backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
